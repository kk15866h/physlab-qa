[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "physlab-qa"
version = "0.1.0"
description = "Reproducible, uncertainty-aware analysis for experimental CSV data."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "PhysLab QA contributors"}]
keywords = [
  "scientific-computing",
  "physics-lab",
  "data-validation",
  "uncertainty",
  "regression",
  "reproducibility",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Quality Assurance",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=8.0", "build>=1.2", "ruff>=0.6", "twine>=5.1"]

[project.scripts]
physlab-qa = "physlab_qa.cli:main"

[project.urls]
Homepage = "https://github.com/kk15866h/physlab-qa"
Source = "https://github.com/kk15866h/physlab-qa"
Issues = "https://github.com/kk15866h/physlab-qa/issues"
Changelog = "https://github.com/kk15866h/physlab-qa/blob/main/CHANGELOG.md"
Documentation = "https://github.com/kk15866h/physlab-qa/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
physlab_qa = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
