name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest
      - name: Build source distribution and wheel
        run: python -m build
      - name: Install built wheel and smoke-test CLI
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          physlab-qa --version
          physlab-qa validate examples/pendulum.csv --numeric-cols length_m,period_squared_s2
          physlab-qa fit examples/pendulum.csv --x length_m --y period_squared_s2 --output build/ci-report.md
          test -s build/ci-report.md
